<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="t">
  <title id="t">Zeki Erman · Computer Engineering student · Building tools for AI coding agents</title>
  <style>
    .clipA { animation: typeA 12s steps(28, end) infinite; }
    .clipB { animation: typeB 12s steps(35, end) infinite; }
    .curA { animation: moveA 12s steps(28, end) infinite; }
    .curB { animation: moveB 12s steps(35, end) infinite; }
    .phaseA { animation: phaseA 12s steps(1) infinite; }
    .phaseB { animation: phaseB 12s steps(1) infinite; }
    .blink { animation: blink 0.9s steps(1) infinite; }
    @keyframes typeA { 0%, 2% { width: 0; } 17% { width: 490px; } 40% { width: 490px; } 47%, 100% { width: 0; } }
    @keyframes moveA { 0%, 2% { transform: translateX(0); } 17% { transform: translateX(490px); } 40% { transform: translateX(490px); } 47%, 100% { transform: translateX(0); } }
    @keyframes typeB { 0%, 51% { width: 0; } 69% { width: 612px; } 90% { width: 612px; } 98%, 100% { width: 0; } }
    @keyframes moveB { 0%, 51% { transform: translateX(0); } 69% { transform: translateX(612px); } 90% { transform: translateX(612px); } 98%, 100% { transform: translateX(0); } }
    @keyframes phaseA { 0% { opacity: 1; } 49% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes phaseB { 0% { opacity: 0; } 49% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141b"/>
      <stop offset="1" stop-color="#171c25"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <clipPath id="cA"><rect class="clipA" x="255" y="140" width="0" height="44"/></clipPath>
    <clipPath id="cB"><rect class="clipB" x="194" y="140" width="0" height="44"/></clipPath>
  </defs>
  <rect x="1" y="1" width="998" height="228" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="112" text-anchor="middle" fill="url(#ink)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-3">Zeki Erman</text>
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#8b949e">
    <g clip-path="url(#cA)"><text x="255" y="171" textLength="490" lengthAdjust="spacingAndGlyphs">Computer Engineering student</text></g>
    <g clip-path="url(#cB)"><text x="194" y="171" textLength="612" lengthAdjust="spacingAndGlyphs">Building tools for <tspan fill="#9cc7ff">AI coding agents</tspan></text></g>
  </g>
  <g class="phaseA"><g class="curA"><rect class="blink" x="257" y="148" width="13" height="29" rx="2" fill="#e6edf3"/></g></g>
  <g class="phaseB"><g class="curB"><rect class="blink" x="196" y="148" width="13" height="29" rx="2" fill="#e6edf3"/></g></g>
</svg>

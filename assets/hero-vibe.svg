<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="t">
  <title id="t">Zeki Erman · Vibe coder since localhost:3000.</title>
  <style>
    .type { animation: type 9s steps(32, end) infinite; }
    .caret { animation: move 9s steps(32, end) infinite, blink 0.9s steps(1) infinite; }
    @keyframes type { 0%, 4% { width: 0; } 34% { width: 560px; } 80% { width: 560px; } 96%, 100% { width: 0; } }
    @keyframes move { 0%, 4% { transform: translateX(0); } 34% { transform: translateX(560px); } 80% { transform: translateX(560px); } 96%, 100% { transform: translateX(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141b"/>
      <stop offset="1" stop-color="#171c25"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <clipPath id="typed"><rect class="type" x="220" y="140" width="0" height="44"/></clipPath>
  </defs>
  <rect x="1" y="1" width="998" height="228" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="112" text-anchor="middle" fill="url(#ink)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-3">Zeki Erman</text>
  <g clip-path="url(#typed)">
    <text x="220" y="171" textLength="560" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="26" fill="#8b949e">Vibe coder since <tspan fill="#9cc7ff">localhost:3000</tspan>.</text>
  </g>
  <rect class="caret" x="222" y="148" width="13" height="29" rx="2" fill="#e6edf3"/>
</svg>
